services:
  - type: web
    name: g7-riesgo-ansiedad-orientacion
    runtime: python
    rootDir: services/orientacion-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 "run:create_app()"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLASK_DEBUG
        value: "false"
      - key: DB_SSL
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOW_ORIGIN
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: ORIENTACION_HELP_LINES
        sync: false
