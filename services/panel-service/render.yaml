services:
  - type: web
    name: g7-riesgo-ansiedad-panel
    runtime: docker
    plan: free
    dockerfilePath: services/panel-service/Dockerfile
    dockerContext: services/panel-service
    healthCheckPath: /api/panel/health
    envVars:
      # TiDB Cloud exige TLS en la conexion a la base de datos.
      - key: DB_SSL
        value: "true"
      - key: FLASK_DEBUG
        value: "false"
      # El plan gratuito duerme el servicio: la primera peticion puede
      # tardar, por eso la espera maxima es holgada.
      - key: EXTERNAL_TIMEOUT_SECONDS
        value: "45"
      # Se completan en el panel de Render. El JWT_SECRET debe ser el mismo
      # que usa el microservicio de usuarios.
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: USERS_BASE_URL
        sync: false
      - key: RISK_EVALUATION_BASE_URL
        sync: false
      - key: CORS_ALLOW_ORIGIN
        sync: false
